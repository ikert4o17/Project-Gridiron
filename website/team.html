<!DOCTYPE html>
<html>

<head>
    <title>Project Gridiron Team Lookup</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<nav>
    <a href="index.html">Dashboard</a>
    |
    <a href="team.html">Team Lookup</a>
</nav>

<h1>🏈 Team Lookup</h1>

<div class="card">

<select id="team-select"></select>

<div id="team-info"></div>

<script src="teams.js"></script>

<script>

const selector = document.getElementById("team-select");
const info = document.getElementById("team-info");


teams.forEach((team, index) => {

    selector.innerHTML += `
    <option value="${index}">
        ${team.name}
    </option>
    `;

});


function showTeam(index){

    let team = teams[index];

    info.innerHTML = `

    <h2>${team.name}</h2>

    <p>Elo Rating: ${team.rating}</p>

    <p>Rank: ${team.rank}</p>

    `;

}


selector.addEventListener(
    "change",
    function(){
        showTeam(this.value);
    }
);


showTeam(0);

</script>

</div>

<div id="team-info"></div>

<script src="teams.js"></script>
<script>

let team = teams[0];

document.getElementById("team-info").innerHTML = `

<h2>${team.name}</h2>

<p>Elo Rating: ${team.rating}</p>

<p>Rank: ${team.rank}</p>

`;

</script>

</div>

</body>

</html>
