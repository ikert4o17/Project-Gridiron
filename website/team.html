<!DOCTYPE html>
<html>

<head>
    <title>Project Gridiron Team Lookup</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <a href="index.html">Dashboard</a>
    |
    <a href="team.html">Team Lookup</a>
</nav>

<h1>🏈 Team Lookup</h1>

<div class="card">

    <input
        type="text"
        id="team-search"
        placeholder="Search for a team..."
    >

    <br><br>

    <select id="team-select"></select>

    <br><br>

    <div id="team-info"></div>

</div>

<script src="teams.js"></script>

<script>

const selector = document.getElementById("team-select");
const info = document.getElementById("team-info");
const search = document.getElementById("team-search");


function populateSelector(filter = "") {

    selector.innerHTML = "";

    teams.forEach((team, index) => {

        if (team.name.toLowerCase().includes(filter.toLowerCase())) {

            selector.innerHTML += `
                <option value="${index}">
                    ${team.name}
                </option>
            `;

        }

    });

}


function showTeam(index) {

    const team = teams[index];

    if (!team) return;

    info.innerHTML = `
        <h2>${team.name}</h2>

        <p>Elo Rating: ${team.rating}</p>

        <p>Rank: ${team.rank}</p>
    `;
}


selector.addEventListener("change", function () {
    showTeam(this.value);
});


search.addEventListener("input", function () {

    populateSelector(this.value);

    if (selector.options.length > 0) {
        showTeam(selector.value);
    } else {
        info.innerHTML = "<p>No teams found.</p>";
    }

});


populateSelector();
showTeam(0);

</script>

</body>

</html>
